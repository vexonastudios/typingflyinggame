<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect 4 Duel - Vexona Game Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="connect4.css">
  <link rel="stylesheet" href="play-timer.css">
  <script src="play-timer.js"></script>
</head>
<body>
    <header class="game-header">
      <a href="index.html" class="hub-back-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to Hub
      </a>
      <div class="header-actions">
        <button id="btnRestartMatch" class="secondary-button" style="padding: 8px 14px; font-size: 0.85rem;">Restart Match</button>
      </div>
    </header>

    <div class="screen active" id="menuScreen">
      <div class="menu-container">
        <div class="menu-logo">
          <div class="menu-chip chip-red"></div>
          <div class="menu-chip chip-yellow"></div>
        </div>
        <h1 class="game-title">Connect <span>4</span></h1>
        <p class="game-subtitle">Line up four to win!</p>
        
        <div class="difficulty-field" style="margin-bottom: 20px;">
          <span style="color: var(--muted); font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 6px;">Bot Difficulty</span>
          <select id="botDifficulty" style="width: 100%; text-align: center;">
            <option value="easy">Easy (Fast)</option>
            <option value="hard" selected>Hard (Smart)</option>
          </select>
        </div>

        <div class="menu-buttons">
          <button id="btnPVP" class="btn btn-red">2 Players (Local)</button>
          <button id="btnPVE" class="btn btn-yellow">Vs AI (Bot)</button>
          <button id="btnTraining" class="btn btn-blue">Training Mode</button>
        </div>
      </div>
    </div>

  <!-- Game Screen -->
  <div id="gameScreen" class="screen">
    <div class="game-layout">
      <!-- Player Info Left (Red) -->
      <div class="player-panel player-panel-1 active-turn">
        <div class="player-avatar chip-red"></div>
        <h2 class="player-name">Player 1</h2>
        <div class="turn-indicator">Your Turn</div>
      </div>

      <!-- Main Board Area -->
      <div class="board-container">
        <!-- Hint overlay removed (handled via JS generated arrows) -->
        
        <div id="board" class="connect4-board">
          <!-- The board has 7 columns -->
          <div class="column" data-col="0"></div>
          <div class="column" data-col="1"></div>
          <div class="column" data-col="2"></div>
          <div class="column" data-col="3"></div>
          <div class="column" data-col="4"></div>
          <div class="column" data-col="5"></div>
          <div class="column" data-col="6"></div>
          
          <!-- Board front visual -->
          <div class="board-front"></div>
        </div>
      </div>

      <!-- Player Info Right (Yellow) -->
      <div class="player-panel player-panel-2">
        <div class="player-avatar chip-yellow"></div>
        <h2 class="player-name" id="p2Name">Player 2</h2>
        <div class="turn-indicator">Waiting...</div>
      </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay hidden">
      <div class="overlay-content">
        <h2 id="winnerText">Player 1 Wins!</h2>
        <button id="btnPlayAgain" class="btn btn-primary">Play Again</button>
        <button id="btnMainMenu" class="btn btn-secondary">Main Menu</button>
      </div>
    </div>
  </div>

  <script src="connect4.js"></script>
</body>
</html>
