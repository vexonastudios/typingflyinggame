<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZTP50MJ7CX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-ZTP50MJ7CX');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lane Blitz – Split Screen Arcade Racer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="racer.css">
  <link rel="stylesheet" href="play-timer.css">
    <script src="profile-manager.js"></script>
  <script src="play-timer.js"></script>
  <script defer src="https://www.bodeebooks.com/bodee-analytics.js"></script>
</head>
<body>

  <!-- Full-screen canvas -->
  <canvas id="raceCanvas"></canvas>

  <!-- ── Setup overlay ── -->
  <div id="raceSetup" class="overlay">
    <div class="setup-box">
      <a href="index.html" class="r-back-btn" style="position:absolute;top:18px;left:22px;">← Hub</a>
      <div class="setup-logo">🏎️</div>
      <h1 class="setup-title">Lane Blitz</h1>
      <p class="setup-sub">Split-screen arcade racer · dodge, jump &amp; blitz to the finish</p>

      <div class="mode-row">
        <span class="mode-label">MODE</span>
        <div class="mode-options">
          <label class="mode-opt selected" id="modeVsLabel">
            <input type="radio" name="mode" value="versus" checked> ⚔️ Versus
            <small>2 players · head-to-head</small>
          </label>
          <label class="mode-opt" id="modeSoloLabel">
            <input type="radio" name="mode" value="solo"> 👤 Solo
            <small>Time trial · beat your best</small>
          </label>
          <label class="mode-opt" id="modeSurvivalLabel">
            <input type="radio" name="mode" value="survival"> 💀 Survival
            <small>2 players · last one alive wins</small>
          </label>
        </div>
      </div>

      <div class="difficulty-row">
        <span class="diff-label">DIFFICULTY</span>
        <div class="diff-options">
          <label class="diff-opt"><input type="radio" name="diff" value="easy"> <span>🟢 Easy</span><small>Relaxed pace</small></label>
          <label class="diff-opt selected"><input type="radio" name="diff" value="medium" checked> <span>🟡 Medium</span><small>Arcade sweet spot</small></label>
          <label class="diff-opt"><input type="radio" name="diff" value="hard"> <span>🔴 Hard</span><small>Relentless</small></label>
        </div>
      </div>

      <div class="controls-display">
        <div class="ctrl-block p1-ctrl">
          <div class="ctrl-badge p1-badge">P1</div>
          <div class="ctrl-keys-list">
            <span class="k">←</span><span class="k">→</span> Move &nbsp; <span class="k">↑</span> Jump
          </div>
        </div>
        <div class="ctrl-divider">VS</div>
        <div class="ctrl-block p2-ctrl">
          <div class="ctrl-badge p2-badge">P2</div>
          <div class="ctrl-keys-list">
            <span class="k">A</span><span class="k">D</span> Move &nbsp; <span class="k">W</span> Jump
          </div>
        </div>
      </div>

      <button id="startRaceBtn" class="start-btn" type="button">🚦 Start Race!</button>
    </div>
  </div>

  <!-- ── HUD overlay (shown during race) ── -->
  <div id="raceHUD" style="display:none; pointer-events:none; position:fixed; inset:0; z-index:50;">
    <!-- filled by JS split-screen per-player HUDs, drawn on canvas -->
  </div>

  <!-- ── Results overlay ── -->
  <div id="raceResults" class="overlay" style="display:none">
    <div class="results-box">
      <div class="results-icon" id="resultsIcon">🏆</div>
      <h2 class="results-title" id="resultsTitle">Race Results</h2>
      <div id="resultsList" class="results-list"></div>
      <div class="results-actions">
        <button id="restartBtn" class="start-btn" type="button">🔄 Race Again</button>
        <a href="index.html" class="hub-link-btn">← Hub</a>
      </div>
    </div>
  </div>

  <script src="racer.js"></script>
</body>
</html>
