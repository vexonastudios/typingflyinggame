<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rift Racer — Split-Screen Arcade Racer</title>
  <meta name="description" content="True independent split-screen arcade obstacle racer. Two players, one course, your own race."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap"/>
  <link rel="stylesheet" href="rift.css"/>
</head>
<body>
  <canvas id="riftCanvas"></canvas>

  <!-- ── SETUP OVERLAY ── -->
  <div id="riftSetup" class="overlay">
    <div class="overlay-card setup-card">
      <div class="game-logo">
        <span class="logo-rift">RIFT</span><span class="logo-racer">RACER</span>
      </div>
      <p class="game-tagline">Two Screens. One Course. Your Own Race.</p>

      <div class="settings-row">
        <div class="settings-col">
          <div class="settings-label">Game Mode</div>
          <div class="mode-grid">
            <label class="mode-opt selected" id="modeVersus">
              <input type="radio" name="mode" value="versus" checked/>
              <span class="mode-icon">⚔️</span>
              <span class="mode-name">Versus</span>
              <span class="mode-desc">First to finish</span>
            </label>
            <label class="mode-opt" id="modeSolo">
              <input type="radio" name="mode" value="solo"/>
              <span class="mode-icon">⏱️</span>
              <span class="mode-name">Solo</span>
              <span class="mode-desc">Time trial</span>
            </label>
            <label class="mode-opt" id="modeSurvival">
              <input type="radio" name="mode" value="survival"/>
              <span class="mode-icon">❤️</span>
              <span class="mode-name">Survival</span>
              <span class="mode-desc">3 lives each</span>
            </label>
          </div>
        </div>

        <div class="settings-col settings-col-diff">
          <div class="settings-label">Difficulty</div>
          <div class="diff-grid">
            <label class="diff-opt" id="diffEasy">
              <input type="radio" name="diff" value="easy"/>
              <span class="diff-name">Easy</span>
            </label>
            <label class="diff-opt selected" id="diffMedium">
              <input type="radio" name="diff" value="medium" checked/>
              <span class="diff-name">Medium</span>
            </label>
            <label class="diff-opt" id="diffHard">
              <input type="radio" name="diff" value="hard"/>
              <span class="diff-name">Hard</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Controls display -->
      <div class="controls-strip" id="controlsStrip">
        <div class="ctrl-panel">
          <div class="ctrl-player" style="color:#ff4466">Player 1</div>
          <div class="ctrl-key-row"><kbd>←</kbd><kbd>→</kbd> Switch Lane &nbsp; <kbd>↑</kbd> Jump</div>
        </div>
        <div class="ctrl-divider">VS</div>
        <div class="ctrl-panel" id="p2ctrl">
          <div class="ctrl-player" style="color:#00ccff">Player 2</div>
          <div class="ctrl-key-row"><kbd>A</kbd><kbd>D</kbd> Switch Lane &nbsp; <kbd>W</kbd> Jump</div>
        </div>
      </div>

      <button id="riftStartBtn" class="btn-primary">🏁 START RACE</button>
      <a href="index.html" class="back-link">← Back to Hub</a>
    </div>
  </div>

  <!-- ── RESULTS OVERLAY ── -->
  <div id="riftResults" class="overlay" style="display:none">
    <div class="overlay-card results-card">
      <div id="resultsEmoji" class="results-emoji">🏆</div>
      <div id="resultsHeadline" class="results-headline">Player 1 Wins!</div>
      <div id="resultsList" class="results-list"></div>
      <div class="result-btns">
        <button id="riftPlayAgainBtn" class="btn-primary">RACE AGAIN</button>
        <button id="riftMenuBtn" class="btn-secondary">MENU</button>
      </div>
    </div>
  </div>

  <script src="rift.js"></script>
</body>
</html>
